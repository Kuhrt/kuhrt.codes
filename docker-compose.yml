# docker-compose.yml for your Droplet
version: '3.8'

networks:
  web:
    driver: bridge

services:
  # Simple Nginx reverse proxy (Cloudflare handles SSL)
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kuhrt-codes
    networks:
      - web
    restart: unless-stopped

  kuhrt-codes:
    image: ghcr.io/kuhrt/kuhrt.codes:latest
    container_name: kuhrt-codes
    networks:
      - web
    restart: unless-stopped
