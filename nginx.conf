# nginx.conf - Simple reverse proxy (Cloudflare handles SSL)
events {
    worker_connections 1024;
}

http {
    upstream kuhrt_codes {
        server kuhrt-codes:3000;
    }
    
    # Future upstreams - uncomment when you add them
    # upstream api_service {
    #     server api-service:3001;
    # }

    # Default server for kuhrt.codes
    server {
        listen 80;
        server_name kuhrt.codes;
        
        location / {
            proxy_pass http://kuhrt_codes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # Future API subdomain - uncomment when ready
    # server {
    #     listen 80;
    #     server_name api.kuhrt.codes;
    #     
    #     location / {
    #         proxy_pass http://api_service;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}