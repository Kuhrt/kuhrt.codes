# .github/workflows/deploy-droplet.yml
name: Deploy to DigitalOcean Droplet

on:
  push:
    branches: [release]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.5.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kuhrt/kuhrt-codes:latest
            ghcr.io/kuhrt/kuhrt-codes:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            # Create deployment directory
            mkdir -p /app/kuhrt-codes
            cd /app/kuhrt-codes

            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: 'docker-compose.yml,nginx.conf'
          target: '/app/kuhrt-codes/'

      - name: Start services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /app/kuhrt-codes

            # Pull latest image
            docker compose pull personal-site

            # Restart services with zero downtime
            docker compose up -d

            # Clean up old images (keep last 2 versions)
            docker image prune -f --filter "until=72h"

            # Logout from registry
            docker logout ghcr.io

            echo "✅ Deployment complete! Site should be live at https://kuhrt.codes"
